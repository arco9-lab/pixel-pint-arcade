name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  BETTER_AUTH_SECRET: "ci-only-auth-secret-at-least-32-characters-long"
  BETTER_AUTH_URL: "http://127.0.0.1:3100"
  DEMO_MODE: "false"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pixel_pint_checks_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/pixel_pint_checks_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and generate Prisma client
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Component tests
        run: npm run test:component

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/pixel_pint_integration_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pixel_pint_integration_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/pixel_pint_integration_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pixel_pint_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pixel_pint_integration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and generate Prisma client
        run: npm ci
      - name: Apply test migrations
        run: npm run test:db:migrate
      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/pixel_pint_e2e_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pixel_pint_e2e_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/pixel_pint_e2e_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pixel_pint_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pixel_pint_e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies and generate Prisma client
        run: npm ci
      - name: Apply test migrations
        run: npm run test:db:migrate
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build application and run E2E
        run: npm run test:e2e
      - name: Upload Playwright reports and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
